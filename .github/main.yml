name: Portfolio-webpage
on:
  push:
    branches:
      - main

jobs:
  Check-Docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Version
        run: docker --version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t portfolio-webpage:latest .

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Push Docker Image to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker tag portfolio-webpage:latest ${{ secrets.DOCKER_USERNAME }}/portfolio-webpage:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-webpage:latest

  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Docker Compose
        run: docker compose up -d
  
      